name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Initialize Android platform if not present
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi
          echo "Syncing Android platform..."
          npx cap sync android

      - name: Disable Android 15 Edge-to-Edge Enforcement in styles.xml
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/res/values/styles.xml";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("android:windowOptOutEdgeToEdgeEnforcement")) {
                const item = "        <item name=\"android:windowOptOutEdgeToEdgeEnforcement\">true</item>\n";
                content = content.replace(/(<style name="AppTheme\.NoActionBar"[^>]*>)/, "$1\n" + item);
                content = content.replace(/(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)/, "$1\n" + item);
                fs.writeFileSync(file, content, "utf8");
                console.log("Added android:windowOptOutEdgeToEdgeEnforcement to styles.xml");
              } else {
                console.log("android:windowOptOutEdgeToEdgeEnforcement already exists in styles.xml");
              }
            } else {
              console.log("styles.xml not found, skipping.");
            }
          '

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Configure Kotlin Stdlib Resolution Strategy
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          TARGET_STRING='configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24" } }'
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "kotlin-stdlib:1.9.24" "$BUILD_GRADLE"; then
              echo "" >> "$BUILD_GRADLE"
              echo "$TARGET_STRING" >> "$BUILD_GRADLE"
              echo "Appended Kotlin stdlib force resolution strategy to $BUILD_GRADLE"
            else
              echo "Kotlin stdlib force resolution strategy already present in $BUILD_GRADLE"
            fi
          else
            echo "Error: $BUILD_GRADLE not found!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Locate Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qb-collection-exam-debug-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release build-${{ github.run_number }}
          body: |
            Automated build for Qb Collection & Exam (Run #${{ github.run_number }}).
            Download the attached debug APK to install on Android devices.
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
